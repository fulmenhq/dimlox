# yamllint disable rule:document-start
# yamllint disable rule:truthy
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner:v0.3.3
      options: --user 1001
    env:
      FULMEN_WORKSPACE_ROOT: ${{ github.workspace }}
      CGO_ENABLED: "0"
      GOPATH: ${{ github.workspace }}/../_go
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare Go directories
        run: mkdir -p "$GOPATH/bin" "$GOPATH/pkg"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Validate VERSION matches tag
        shell: bash
        run: |
          set -euo pipefail
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          TAG_VERSION="${GITHUB_REF_NAME}"
          echo "VERSION file: ${FILE_VERSION}"
          echo "Git tag: ${TAG_VERSION}"
          if [ "${FILE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::VERSION (${FILE_VERSION}) != tag (${TAG_VERSION})"
            exit 1
          fi

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          goneat --version
          sfetch --version
          go version
          go mod download

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
          args: --help

      - name: Verify golangci-lint
        shell: bash
        run: |
          set -euo pipefail
          golangci-lint --version

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          make lint

      - name: Test (short)
        shell: bash
        run: |
          set -euo pipefail
          make test-short

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          make release-build

      - name: Publish GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/release/*
