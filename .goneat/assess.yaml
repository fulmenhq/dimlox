# .goneat/assess.yaml — goneat assess configuration for dimlox
# See: goneat docs show user-guide/commands/assess
#
# Run: goneat assess --categories format,lint,security
version: 1
lint:
  yamllint:
    enabled: true
    strict: true
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - ".goneat/**/*.yaml"
    ignore:
      - ".git/**"
      - "vendor/**"
      - "dist/**"
      - ".plans/**"
  github_actions:
    actionlint:
      enabled: true
      paths:
        - ".github/workflows/**/*.yml"
        - ".github/workflows/**/*.yaml"
      ignore:
        - ".git/**"
        - ".plans/**"
  shell:
    paths: ["**/*.sh", "scripts/**/*"]
    ignore:
      - ".git/**"
      - "vendor/**"
      - "dist/**"
      - ".plans/**"
    shfmt:
      enabled: true
      fix: false
      # Optional: ensure lint agrees with your repo's shfmt style
      # (goneat controls -d/-w; only put style flags here)
      args: ["-i", "4", "-ci"]
    shellcheck:
      enabled: false
  make:
    checkmake:
      enabled: true
      config:
        max_body_length: 70  # bootstrap targets need room
        min_phony_targets:
          - all
          - clean
          - test
    paths:
      - "Makefile"
    ignore:
      - ".git/**"
      - ".plans/**"
# Format configuration — controls goneat format and goneat assess --categories format
format:
  # EOF and trailing whitespace
  eof:
    enabled: true
    enforce_single_newline: true
  trailing_whitespace:
    enabled: true
  # Markdown — uses prettier
  markdown:
    enabled: true
    paths:
      - "**/*.md"
    ignore:
      - ".plans/**"
      - "**/node_modules/**"
  # JSON — uses jq
  json:
    enabled: true
    paths:
      - "**/*.json"
    ignore: []
  # YAML — uses yamlfmt
  yaml:
    enabled: true
    paths:
      - "**/*.yaml"
      - "**/*.yml"
    ignore:
      - "**/node_modules/**"
