# goneat Tools Configuration (v1.0.0)
# dimlox — Go CLI project
#
# Scopes:
#   foundation  language-agnostic tools (formatting, linting, shell, markdown)
#   go          Go toolchain and quality tools
#   security    secret scanning
#
# Validate: goneat doctor tools --validate-config
# Install:  goneat doctor tools --scope foundation --install --yes --no-cooling
#           goneat doctor tools --scope go --install --yes --no-cooling
# Note: system tools (ripgrep, jq, shellcheck, yamllint, prettier) print apt/npm
#       advisory commands — run those manually, then re-run doctor to verify.

scopes:
  foundation:
    description: Language-agnostic tools for formatting, linting, and shell scripts
    tools:
      - ripgrep
      - jq
      - prettier
      - yamlfmt
      - yamllint
      - shfmt
      - shellcheck
      - actionlint
      - checkmake
      - minisign

  go:
    description: Go development and quality tools
    tools:
      - go
      - gofmt
      - goimports
      - golangci-lint
      - gosec
      - govulncheck

  security:
    description: Secret and credential scanning
    tools:
      - gitleaks

  sbom:
    description: License compliance and software bill of materials
    tools:
      - go-licenses
      - syft

tools:
  actionlint:
    name: actionlint
    description: GitHub Actions workflow linter
    kind: go
    detect_command: actionlint -version
    install_package: github.com/rhysd/actionlint/cmd/actionlint@latest
    version_args: [-version]
    check_args: [-help]
    installer_priority:
      all: [go-install]
    version_scheme: semver
    minimum_version: 1.7.0
    recommended_version: 1.7.8

  checkmake:
    name: checkmake
    description: Makefile linter
    kind: go
    detect_command: checkmake -v
    install_package: github.com/mrtazz/checkmake/cmd/checkmake@latest
    version_args: [-v]
    check_args: [-h]
    installer_priority:
      all: [go-install]
    version_scheme: semver
    minimum_version: 0.2.0
    recommended_version: 0.3.0

  gitleaks:
    name: gitleaks
    description: Git secrets scanner — important for cloud credential code
    kind: go
    detect_command: gitleaks version
    install_package: github.com/zricethezav/gitleaks/v8@latest
    version_args: [version]
    check_args: [help]
    installer_priority:
      all: [go-install]

  go:
    name: go
    description: Go toolchain
    kind: system
    detect_command: go version
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [brew]
      windows: [scoop, winget]
    version_scheme: semver
    minimum_version: 1.23.0
    recommended_version: 1.26.0

  gofmt:
    name: gofmt
    description: Go formatter (bundled with Go toolchain)
    kind: bundled-go
    detect_command: gofmt -h
    check_args: [-h]
    installer_priority:
      all: [builtin]

  goimports:
    name: goimports
    description: Go import formatter
    kind: go
    detect_command: goimports -h
    install_package: golang.org/x/tools/cmd/goimports@latest
    check_args: [-h]
    installer_priority:
      all: [go-install]

  golangci-lint:
    name: golangci-lint
    description: Fast linters runner for Go
    kind: go
    detect_command: golangci-lint --version
    install_package: github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
    version_args: [--version]
    check_args: [--help]
    installer_priority:
      darwin: [brew, go-install]
      linux: [go-install]
      windows: [go-install]
    version_scheme: semver
    minimum_version: 2.0.0
    recommended_version: 2.10.0

  gosec:
    name: gosec
    description: Go security checker — required for auth/credential code review
    kind: go
    detect_command: gosec -version
    install_package: github.com/securego/gosec/v2/cmd/gosec@latest
    version_args: [-version]
    check_args: [-h]
    installer_priority:
      darwin: [brew, go-install]
      linux: [go-install]
      windows: [go-install]
    version_scheme: semver
    minimum_version: 2.18.0
    recommended_version: 2.23.0

  govulncheck:
    name: govulncheck
    description: Go vulnerability checker
    kind: go
    detect_command: govulncheck -version
    install_package: golang.org/x/vuln/cmd/govulncheck@latest
    version_args: [-version]
    check_args: [-h]
    installer_priority:
      all: [go-install]
    version_scheme: semver
    minimum_version: 1.0.0
    recommended_version: 1.1.0

  go-licenses:
    name: go-licenses
    description: License compliance for Go dependencies
    kind: go
    detect_command: go-licenses -h
    install_package: github.com/google/go-licenses@latest
    check_args: [-h]
    installer_priority:
      all: [go-install]

  syft:
    name: syft
    description: SBOM generator for supply chain compliance
    kind: system
    detect_command: syft version
    version_args: [version]
    check_args: [--help]
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [manual]
      windows: [scoop]
    install_commands:
      manual: |
        echo "Run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b ~/.local/bin"
    version_scheme: semver
    minimum_version: 1.0.0
    recommended_version: 1.42.0

  jq:
    name: jq
    description: JSON processor — used for reading state.json and thread.jsonl
    kind: system
    detect_command: jq --version
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [manual]
      windows: [scoop, winget]
    install_commands:
      manual: |
        echo "Run: sudo apt install jq"
    version_scheme: semver
    minimum_version: 1.7.0
    recommended_version: 1.7.1

  minisign:
    name: minisign
    description: Minimal signing utility for release artifacts
    kind: system
    detect_command: minisign -v
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [manual]
      windows: [scoop]
    install_commands:
      manual: |
        echo "Run: sudo apt install minisign"

  prettier:
    name: prettier
    description: Markdown formatter for docs and .plans/ files
    kind: node
    detect_command: prettier --version
    installer_priority:
      darwin: [brew]
      linux: [manual]
      windows: [bun, npm]
    install_commands:
      manual: |
        echo "Run: npm install -g prettier  # requires Node.js (nvm available on this machine)"
    version_scheme: semver
    minimum_version: 3.0.0
    recommended_version: 3.8.0

  ripgrep:
    name: ripgrep
    description: Fast text search — used internally by goneat
    kind: system
    detect_command: rg --version
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [manual]
      windows: [scoop, winget]
    install_commands:
      manual: |
        echo "Run: sudo apt install ripgrep"
    version_scheme: semver
    minimum_version: 14.0.0
    recommended_version: 14.1.0

  shellcheck:
    name: shellcheck
    description: Shell script analyzer
    kind: system
    detect_command: shellcheck --version
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [manual]
      windows: [scoop, winget]
    install_commands:
      manual: |
        echo "Run: sudo apt install shellcheck"
    version_scheme: semver
    minimum_version: 0.9.0
    recommended_version: 0.11.0

  shfmt:
    name: shfmt
    description: Shell script formatter
    kind: go
    detect_command: shfmt -version
    install_package: mvdan.cc/sh/v3/cmd/shfmt@latest
    version_args: [-version]
    check_args: [-version]
    installer_priority:
      all: [go-install]

  yamlfmt:
    name: yamlfmt
    description: YAML formatter — for role YAML files in config/agentic/roles/
    kind: go
    detect_command: yamlfmt --version
    install_package: github.com/google/yamlfmt/cmd/yamlfmt@latest
    version_args: [--version]
    check_args: [--help]
    installer_priority:
      all: [go-install]
    version_scheme: semver
    minimum_version: 0.16.0
    recommended_version: 0.21.0

  yamllint:
    name: yamllint
    description: YAML syntax linter — for role YAML files
    kind: system
    detect_command: yamllint --version
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [manual]
      windows: [manual]
    install_commands:
      manual: |
        echo "Run: sudo apt install yamllint"
      windows: |
        echo "yamllint is a Python tool. Install via uv (recommended on Windows):"
        echo "  1. irm https://astral.sh/uv/install.ps1 | iex   # install uv (one-time)"
        echo "  2. uv tool install yamllint                       # installs yamllint.exe on PATH"
    version_scheme: semver
    minimum_version: 1.33.0
    recommended_version: 1.38.0
